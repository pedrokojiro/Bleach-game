[preset.0]
name="Windows Desktop"
platform="Windows Desktop"
runnable=true
export_filter="all_resources"
include_filter="*.json"
exclude_filter="tests/*,qa/*,export/*"
export_path="export/windows/BleachGodot.exe"

[preset.0.options]
custom_template/debug="../.tools/godot/templates/windows_debug_x86_64.exe"
custom_template/release="../.tools/godot/templates/windows_release_x86_64.exe"
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
codesign/enable=false
application/modify_resources=false

[preset.1]
name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter="*.json"
exclude_filter="tests/*,qa/*,export/*"
export_path="export/web/index.html"

[preset.1.options]
custom_template/debug="../.tools/godot/templates/web_nothreads_debug.zip"
custom_template/release="../.tools/godot/templates/web_nothreads_release.zip"
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
progressive_web_app/enabled=false
